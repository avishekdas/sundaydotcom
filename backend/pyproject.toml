[project]
name = "tasklane"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.9",
  "aws-lambda-powertools>=3.20",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "hypothesis>=6.112",
  "psycopg[binary]>=3.2",
  "embedded-postgres>=18.6",
  "ruff>=0.7",
  "mypy>=1.13",
  "import-linter>=2.1",
  "boto3>=1.35",
  "moto[cognitoidp,dynamodb,s3,sesv2]>=5",
  "jsonschema>=4.23",
  "starlette>=0.40",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pyyaml>=6.0.3",
  "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tasklane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "ac(id): acceptance criterion covered by this test",
  "integration: needs the embedded PostgreSQL",
  "north_star(step): north-star step driven by this test (contracts/north_star.yaml)",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "E501"]  # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S608"]  # tests build fixture SQL from constants

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"

[tool.importlinter]
root_package = "tasklane"

[[tool.importlinter.contracts]]
name = "Layered architecture (arch 11)"
type = "layers"
layers = [
  "tasklane.devserver",  # local composition root: wires api + workers in-process (DL-9); never deployed
  "tasklane.api | tasklane.workers",
  "tasklane.collab | tasklane.automation | tasklane.insights | tasklane.crm | tasklane.forms",
  "tasklane.workmgmt",
  "tasklane.computed",
  "tasklane.schema",
  "tasklane.identity",
  "tasklane.platform",
]
