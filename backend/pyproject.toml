[project]
name = "tasklane"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "hypothesis>=6.112",
  "psycopg[binary]>=3.2",
  "embedded-postgres>=18.6",
  "ruff>=0.7",
  "mypy>=1.13",
  "import-linter>=2.1",
  "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tasklane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "ac(id): acceptance criterion covered by this test",
  "integration: needs the embedded PostgreSQL",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "E501"]  # line length is the formatter's job

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"

[tool.importlinter]
root_package = "tasklane"

[[tool.importlinter.contracts]]
name = "Layered architecture (arch 11)"
type = "layers"
layers = [
  "tasklane.api | tasklane.workers | tasklane.devserver",
  "tasklane.collab | tasklane.automation | tasklane.insights | tasklane.crm | tasklane.forms",
  "tasklane.workmgmt",
  "tasklane.computed",
  "tasklane.schema",
  "tasklane.identity",
  "tasklane.platform",
]
