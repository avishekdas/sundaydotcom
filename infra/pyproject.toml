[project]
name = "tasklane-infra"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = ["aws-cdk-lib>=2.220", "constructs>=10.4", "cdk-nag>=2.35"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "E501"]
