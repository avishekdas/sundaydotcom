name: e2e-dev
# Tier B north star on the deployed dev stage (plan §1.2): runs after every successful deploy.
on:
  workflow_run: { workflows: [deploy-dev], types: [completed], branches: [main] }
  workflow_dispatch:
permissions: { id-token: write, contents: read }
concurrency: { group: e2e-dev, cancel-in-progress: false }
jobs:
  north-star:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 20
    defaults: { run: { working-directory: e2e } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::920824005451:role/tasklane-gh-deploy-dev
          aws-region: us-east-1
      - name: Test identities and URL
        # D-049: scripted users (admin, member, viewer, outsider) in one secret → E2E_<NAME>_EMAIL / _PASSWORD;
        # the M0b skeleton spec signs in as the admin (E2E_EMAIL / E2E_PASSWORD).
        run: |
          s=$(aws secretsmanager get-secret-value --secret-id tasklane/dev/test-users/all --query SecretString --output text)
          for n in admin member viewer outsider; do
            p=$(echo "$s" | jq -r ".$n.password"); echo "::add-mask::$p"
            u=$(echo "$n" | tr a-z A-Z)
            echo "E2E_${u}_EMAIL=$(echo "$s" | jq -r ".$n.email")" >> "$GITHUB_ENV"
            echo "E2E_${u}_PASSWORD=$p" >> "$GITHUB_ENV"
          done
          echo "E2E_EMAIL=$(echo "$s" | jq -r .admin.email)" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$(echo "$s" | jq -r .admin.password)" >> "$GITHUB_ENV"
          url=$(aws cloudformation describe-stacks --stack-name tasklane-dev-edge \
                --query "Stacks[0].Outputs[?starts_with(OutputKey,'Url')].OutputValue" --output text)
          echo "BASE_URL=$url" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: ../scripts/ci-run.sh npx playwright test
      - name: AC-K7-2 two-IP check (runner = IP A, ip-probe λ = IP B)
        run: ../scripts/ci-run.sh ../scripts/ac-k7-2-probe.sh
