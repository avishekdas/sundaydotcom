name: deploy-dev
on:
  workflow_run: { workflows: [ci], types: [completed], branches: [main] }
  workflow_dispatch:
permissions: { id-token: write, contents: read }
concurrency: { group: deploy-dev, cancel-in-progress: false }
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 45
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13", enable-cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::920824005451:role/tasklane-gh-deploy-dev
          aws-region: us-east-1
      - run: uv sync --locked
      - run: npx -y aws-cdk@2.1146.1 deploy --all --require-approval never --ci --progress events
